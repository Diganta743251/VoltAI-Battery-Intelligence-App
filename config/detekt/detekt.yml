build:
  maxIssues: 200  # Allow more issues for now
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    LongMethod: 1
    CyclomaticComplexMethod: 2
    naming: 1
    style: 1
    exceptions: 2
    potential-bugs: 2

config:
  validation: true

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludes: ['**/ui/**', '**/screens/**', '**/compose/**']
  UnusedPrivateMember:
    active: true

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 30  # Increased threshold
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: true
    ignoreAnnotated: ['Composable', 'Preview']
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    threshold: 200  # Increased threshold
  LongParameterList:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    functionThreshold: 15  # Increased threshold
  TooManyFunctions:
    active: true
    thresholdInClasses: 50
    thresholdInObjects: 50

performance:
  SpreadOperator:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

exceptions:
  SwallowedException:
    active: false  # Disable for now

potential-bugs:
  ImplicitDefaultLocale:
    active: false  # Disable for string formatting
