plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.10'
    id 'io.gitlab.arturbosch.detekt'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'jacoco'
    id 'com.github.triplet.play' version '3.9.1'
}

// KAPT arguments for Room schema export
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
    }
}

// ktlint {
//     android = true
//     outputToConsole = true
//     ignoreFailures = false
// }

detekt {
    buildUponDefaultConfig = true
    config = files("${rootDir}/config/detekt/detekt.yml")
    allRules = true
    autoCorrect = true
    ignoreFailures = true
    parallel = true
}

android {
    namespace 'com.voltai.smartbatteryguardian'
    compileSdk 34
    
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java'
            }
            kotlin {
                srcDirs 'src/main/java'
            }
        }
    }

    defaultConfig {
        applicationId 'com.voltai.smartbatteryguardian'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    def hasKeystore = file("../keystore/voltai.jks").exists() &&
        System.getenv("KEYSTORE_PASSWORD") && System.getenv("KEY_ALIAS") && System.getenv("KEY_PASSWORD")

signingConfigs {
        if (hasKeystore) {
            release {
                // Release keystore from env vars (configured in local env or CI secrets)
                storeFile file("../keystore/voltai.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore && signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            } else {
                println "No release keystore found. Building unsigned release bundle locally."
            }
            
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors true
        disable 'MissingTranslation' // Temporary until i18n is added
        baseline file("lint-baseline.xml")
    }
    packaging {
        resources {
            pickFirst 'META-INF/AL2.0'
            pickFirst 'META-INF/LGPL2.1'
            pickFirst 'META-INF/INDEX.LIST'
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/LICENSE'
            exclude 'META-INF/LICENSE.txt'
            exclude 'META-INF/NOTICE'
            exclude 'META-INF/NOTICE.txt'
            // Exclude duplicate license/notice files that can appear from test dependencies (e.g., JUnit Jupiter)
            exclude 'META-INF/LICENSE.md'
            exclude 'META-INF/NOTICE.md'
            exclude 'META-INF/LICENSE-notice.md'
        }
    }
}

play {
    serviceAccountCredentials.set(file("play-service.json"))
    track.set("internal")
    defaultToAppBundles.set(true)
}

// Expose version info for CI notifications
tasks.register("printVersionInfo") {
    doLast {
        def vName = android.defaultConfig.versionName
        def vCode = android.defaultConfig.versionCode
        println("VERSION_NAME=${vName}")
        println("VERSION_CODE=${vCode}")
    }
}

// Jacoco test coverage configuration
jacoco {
    toolVersion = "0.8.9"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    executionData fileTree(dir: "$buildDir/jacoco", include: "**/*.exec")
    
    sourceDirectories.setFrom("$projectDir/src/main/java")
    classDirectories.setFrom(
        fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: [
            '**/R.class',
            '**/R$*.class',
            '**/*$WhenMappings.*',
            '**/*$Companion.*',
            '**/*Test*.*',
            'android/**/*.*'
        ])
    )
}

