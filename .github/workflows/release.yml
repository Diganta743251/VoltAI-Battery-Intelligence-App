name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test, Analyze, Release
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_API: 34
      ANDROID_BUILD_TOOLS: 34.0.0
      KEYSTORE_FILE: keystore/voltai.jks
      PLAY_CONFIG: play-service.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > $KEYSTORE_FILE
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Decode Play Service JSON
        if: github.ref == 'refs/heads/main'
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > $PLAY_CONFIG
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :core:test :features:test

      - name: Run Jacoco Coverage
        run: |
          ./gradlew :core:jacocoTestReport :core:jacocoTestCoverageVerification \
            -PcoverageMinimum=0.60

      - name: Run Detekt
        run: ./gradlew :app:detekt

      - name: Run ktlint
        run: ./gradlew :app:ktlintCheck

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        if: github.ref == 'refs/heads/main'
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Read app version
        id: app_version
        run: |
          OUT=$(./gradlew :app:printVersionInfo -q | grep VERSION_)
          echo "$OUT"
          echo "$OUT" | while IFS= read -r line; do echo "$line" >> $GITHUB_OUTPUT; done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: VoltAI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: |
            core/build/reports/jacoco/jacocoTestReport/html/**
            core/build/reports/jacoco/jacocoTestReport/*.xml
            core/build/reports/tests/**
            core/build/test-results/**
            features/build/reports/tests/**
            features/build/test-results/**
            app/build/reports/detekt/**
            app/build/reports/ktlint/**

      - name: Publish to Google Play (Internal Track)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew publishRelease

      - name: Slack notify (success)
        if: success() && github.ref == 'refs/heads/main' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_NAME: ${{ steps.app_version.outputs.VERSION_NAME || '' }}
          VERSION_CODE: ${{ steps.app_version.outputs.VERSION_CODE || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="✅ VoltAI ${VERSION_NAME:-release} (${VERSION_CODE:-}) published to Google Play Internal\n<${RUN_URL}|View CI run>"
          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Slack notify (failure)
        if: failure() && github.ref == 'refs/heads/main' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="❌ VoltAI release failed. <${RUN_URL}|View CI run>"
          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Discord notify (success)
        if: success() && github.ref == 'refs/heads/main' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION_NAME: ${{ steps.app_version.outputs.VERSION_NAME || '' }}
          VERSION_CODE: ${{ steps.app_version.outputs.VERSION_CODE || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          content="✅ VoltAI ${VERSION_NAME:-release} (${VERSION_CODE:-}) published to Google Play Internal\nRun: ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content: $c}')
          curl -X POST -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"

      - name: Discord notify (failure)
        if: failure() && github.ref == 'refs/heads/main' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          content="❌ VoltAI release failed. Run: ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content: $c}')
          curl -X POST -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"