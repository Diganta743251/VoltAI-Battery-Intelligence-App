name: Multi-Module Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "**" ]
  push:
    branches-ignore: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Lint (PR)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint Multi-Module Project (Android Lint, Detekt, ktlint)
        run: |
          ./gradlew lintDebug detekt ktlintCheck --continue --stacktrace

      - name: Multi-Module Unit Tests
        run: |
          ./gradlew testDebugUnitTest :domain:test --continue --stacktrace

      - name: Jacoco Coverage Verification
        run: |
          ./gradlew :core:jacocoTestReport :core:jacocoTestCoverageVerification -PcoverageMinimum=0.60 --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify Release Build & ProGuard Shrinking
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Read App Version Info
        id: app_version
        run: |
          OUT=$(./gradlew :app:printVersionInfo -q | grep VERSION_ || true)
          echo "$OUT"
          echo "$OUT" | while IFS= read -r line; do echo "$line" >> $GITHUB_OUTPUT; done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Test & Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: |
            **/build/reports/lint-results*.*
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            core/build/reports/jacoco/**
          if-no-files-found: ignore

      - name: Slack notify (PR success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_NAME: ${{ steps.app_version.outputs.VERSION_NAME || '' }}
          VERSION_CODE: ${{ steps.app_version.outputs.VERSION_CODE || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          title="✅ VoltAI PR ${PR_NUMBER:-} built v${VERSION_NAME:-?} (${VERSION_CODE:-?})"
          text="${title}\n<${RUN_URL}|View CI run>"
          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Discord notify (PR success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION_NAME: ${{ steps.app_version.outputs.VERSION_NAME || '' }}
          VERSION_CODE: ${{ steps.app_version.outputs.VERSION_CODE || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          content="✅ VoltAI PR ${PR_NUMBER:-} built v${VERSION_NAME:-?} (${VERSION_CODE:-?})\nRun: ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content: $c}')
          curl -X POST -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"